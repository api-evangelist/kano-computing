name: Kano Computing
description: >-
  Kano Computing is a London-based technology company founded in 2013 by Alex Klein,
  Saul Klein and Yonatan Raz-Fridman that began by shipping build-it-yourself computer
  and coding kits designed to teach STEM and creative computing to children on top of
  Raspberry Pi hardware. Its catalog spanned the Kano Computer Kit, motion-sensor and
  Harry Potter / Star Wars coding wands, the Windows-based Kano PC built with Microsoft,
  and the Stem Player and Stem Video Projector consumer devices. Kano paired the hardware
  with Kano Code, a block-to-text creative-coding platform, and Kano World, an online
  making and sharing community. The company entered administration in 2023 and its assets
  now trade under the Stem brand; its developer footprint survives as open-source tooling
  in the KanoComputing GitHub organization and the npm @kano scope rather than a hosted API.
